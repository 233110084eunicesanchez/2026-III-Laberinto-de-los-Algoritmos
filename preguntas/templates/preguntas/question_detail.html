{% extends 'base.html' %}{% block content %}<div class="panel form-panel"><span class="eyebrow">{{ object.category }} · {{ object.topic }}</span><h1>{{ object.text }}</h1><ol type="A">{% for option in object.options %}<li>{{ option }}</li>{% endfor %}</ol><p>Respuesta: <strong>{{ object.get_correct_display }}</strong></p><p>{{ object.explanation }}</p><a class="button" href="{% url 'preguntas:question_update' object.pk %}">Editar</a></div>{% endblock %}
