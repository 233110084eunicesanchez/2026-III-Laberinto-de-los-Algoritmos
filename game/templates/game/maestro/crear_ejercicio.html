{% extends 'base.html' %}

{% block title %}Crear Ejercicio - Panel Maestro{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <a href="{% url 'mis_grupos' %}" class="back-link">← Volver a Grupos</a>
        <h2>Crear Nuevo Ejercicio / Nivel</h2>

        <form method="POST" class="custom-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="titulo">Título del Ejercicio:</label>
                <input type="text" id="titulo" name="titulo" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="descripcion">Descripción / Instrucciones:</label>
                <textarea id="descripcion" name="descripcion" rows="4" class="form-control" required></textarea>
            </div>

            <div class="form-group">
                <label for="dificultad">Nivel de Dificultad (1 a 5):</label>
                <input type="number" id="dificultad" name="dificultad" min="1" max="5" value="1" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success btn-block">Guardar Ejercicio</button>
        </form>
    </div>
</div>
{% endblock %}
