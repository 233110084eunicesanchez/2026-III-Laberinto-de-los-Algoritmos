{% extends 'base.html' %}

{% block title %}Crear Usuario - Admin{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <a href="{% url 'panel_admin_custom' %}" class="back-link">← Volver al Panel</a>
        <h2>Crear Nuevo Usuario</h2>

        <form method="POST" class="custom-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="nombre">Nombre de Usuario:</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="rol_id">Rol:</label>
                <select id="rol_id" name="rol_id" class="form-control" required>
                    {% for r in roles %}
                        <option value="{{ r.id_rol }}">{{ r.nombre_rol }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-success btn-block">Guardar Usuario</button>
        </form>
    </div>
</div>
{% endblock %}
