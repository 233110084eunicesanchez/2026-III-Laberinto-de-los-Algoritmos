{% extends 'base.html' %}

{% block content %}
<!-- Contenedor principal para centrar todo en la pantalla -->
<div class="screen active">
    
    <!-- Cuadro con estilo "glassmorphism" del CSS original -->
    <div class="mission-frame" style="max-width: 400px; width: 100%; text-align: center;">
        
        <div class="robot-circle" style="width: 80px; height: 80px; font-size: 40px; margin-bottom: 1rem;">
            🤖
        </div>
        
        <h2 style="margin-bottom: 1.5rem;">Iniciar Sesión</h2>
        
        <!-- Mensajes de error (Soporta errores de la vista y del framework de mensajes) -->
        {% if error %}
            <div style="margin-bottom: 1rem; background: var(--error-container, #ffdad6); padding: 10px; border-radius: 8px; border: 1px solid var(--error, #ba1a1a);">
                <p style="color: var(--on-error, #410002); font-size: 14px; margin: 0; font-weight: bold;">{{ error }}</p>
            </div>
        {% endif %}

        {% if messages %}
            <div style="margin-bottom: 1rem; background: var(--error-container, #ffdad6); padding: 10px; border-radius: 8px; border: 1px solid var(--error, #ba1a1a);">
                {% for message in messages %}
                    <p style="color: var(--on-error, #410002); font-size: 14px; margin: 0;">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login_custom' %}" style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
            {% csrf_token %}
            
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label for="username" style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: var(--on-surface-var);">Usuario o Correo:</label>
                <input type="text" id="username" name="username" required 
                       style="padding: 12px; border-radius: 10px; border: 2px solid var(--outline-var); background: var(--surface-high); color: var(--on-surface); font-family: inherit; font-size: 15px; outline: none;">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label for="password" style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: var(--on-surface-var);">Contraseña:</label>
                <input type="password" id="password" name="password" required 
                       style="padding: 12px; border-radius: 10px; border: 2px solid var(--outline-var); background: var(--surface-high); color: var(--on-surface); font-family: inherit; font-size: 15px; outline: none;">
            </div>
            
            <div style="margin-top: 1rem; display: flex; justify-content: center;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <span class="icon">login</span> Entrar
                </button>
            </div>
        </form>
        
    </div>
</div>
{% endblock %}
